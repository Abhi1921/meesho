<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meesho Link Manager & Showcase | Meesho Product Link Generator</title>
  <meta name="description" content="Paste Meesho product links, fetch product pictures, and showcase products with target redirect links.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="https://www.meesho.com/favicon.ico" type="image/x-icon">
</head>
<body>

  <!-- ================= HEADER SECTION ================= -->
  <header class="meesho-header">
    <div class="header-top">
      <!-- Logo -->
      <a href="https://www.meesho.com" target="_blank" class="logo-container">
        <span class="meesho-logo-text">meesho<span class="meesho-logo-dot">.</span></span>
      </a>

      <!-- Quick Actions -->
      <div class="header-actions">
        <a href="https://www.meesho.com" target="_blank" class="nav-link">Visit Meesho.com ↗</a>
        <a href="https://supplier.meesho.com" target="_blank" class="nav-link">Become a Supplier</a>
      </div>
    </div>
  </header>

  <!-- ================= ADD MEESHO LINK CARD (HERO SECTION) ================= -->
  <section class="add-link-section">
    <div class="add-link-card">
      <div class="card-header-flex">
        <h1 class="add-title">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f43397" stroke-width="2.5">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span>Add Meesho Product Link</span>
        </h1>
        <span class="add-badge">Auto Image & Title Extractor</span>
      </div>

      <form id="addLinkForm">
        <div class="link-input-group">
          <input type="url" id="meeshoUrlInput" class="link-input" placeholder="Paste Meesho link here... e.g. https://www.meesho.com/saree/p/1xxxx" required>
          <button type="submit" class="fetch-btn">
            <span>Get Product & Add Link</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>

        <!-- Optional custom inputs -->
        <div class="optional-fields-grid">
          <input type="text" id="customTitleInput" class="sub-input" placeholder="Optional: Custom Product Title (leave empty to auto-fetch)">
          <input type="url" id="customImageInput" class="sub-input" placeholder="Optional: Custom Image URL (leave empty to auto-fetch)">
        </div>

        <div id="statusMessage" class="status-message"></div>
      </form>
    </div>
  </section>

  <!-- ================= DYNAMIC PRODUCTS & LINKS SHOWCASE ================= -->
  <main class="catalog-main">
    <div class="catalog-header-bar">
      <div>
        <h2 class="catalog-title">Your Meesho Link Showcase <span id="productCount" class="count-badge">0 Items</span></h2>
      </div>
      <button class="clear-all-btn" onclick="clearAllProducts()">Clear All Links</button>
    </div>

    <!-- Dynamic Products Grid -->
    <div id="productsGrid" class="products-grid"></div>
  </main>

  <!-- Toast Notification -->
  <div id="redirectToast" class="redirect-toast">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f43397" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 16 16 12 12 8"></polyline>
      <line x1="8" y1="12" x2="16" y2="12"></line>
    </svg>
    <span id="toastText" class="toast-text">Opening Meesho link...</span>
  </div>

  <!-- Footer -->
  <footer class="meesho-footer">
    <p>© 2026 Meesho Link Manager. All pasted links open directly on official meesho.com.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
